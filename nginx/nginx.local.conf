# Local prod-like proxy. Next.js runs on the HOST, not in a container,
# so nginx reaches it via the IPv4 gateway alias from extra_hosts.
server {
    listen 80;
    server_name localhost lucentnepal.com www.lucentnepal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost lucentnepal.com www.lucentnepal.com;

    ssl_certificate     /etc/nginx/certs/lucent.crt;
    ssl_certificate_key /etc/nginx/certs/lucent.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    location / {
        proxy_pass http://lucent-host:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off; # chat (/api/chat) is SSE; don't buffer it
    }
}
